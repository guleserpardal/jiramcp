# Alembic config for development (`uv run alembic upgrade head`).
# Production/pip installs: `python -m mcp_atlassian.db upgrade` (no ini needed).
# The database URL is NEVER written here: it comes from MCP_STORAGE_PG_URL.
[alembic]
script_location = %(here)s/src/mcp_atlassian/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
